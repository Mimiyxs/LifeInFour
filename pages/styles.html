
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Your Style — LumiBooth</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/styles.css">

    <script src="../js/style.js" defer></script>
</head>

<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="logo">
                lumi<span>booth.</span>
            </a>

            <a href="../index.html" class="back-home">
                ← Back to home
            </a>
        </div>
    </header>

    <main class="styles-page">

        <div class="styles-container">

            <div class="progress-section">
                <span>STEP 01 OF 03</span>
                <div class="progress-track">
                    <div class="progress-fill"></div>
                </div>
                <span>STYLE</span>
            </div>

            <div class="styles-heading">
                <h1>
                    Choose your <em>style.</em>
                </h1>
            </div>

            <section class="style-grid" aria-label="Photo styles">

                <button class="style-card" data-style="natural"
                        aria-pressed="false">

                    <div class="style-image natural-image">
                        <img src="../images/natural.jpg"
                             alt="Natural portrait photography">

                        <span class="style-tag">01</span>
                        <span class="selected-icon">✓</span>
                    </div>

                    <div class="style-info">
                        <div>
                            <h2>Natural</h2>
                            <p>Soft colors.</p>
                        </div>
                        <span class="style-arrow">↗</span>
                    </div>

                </button>


                <button class="style-card" data-style="vintage"
                        aria-pressed="false">

                    <div class="style-image vintage-image">
                        <img src="../images/vintage.jpeg"
                             alt="Warm vintage portrait photography">

                        <span class="style-tag">02</span>
                        <span class="selected-icon">✓</span>
                    </div>

                    <div class="style-info">
                        <div>
                            <h2>Vintage Film</h2>
                            <p>A little nostalgia.</p>
                        </div>
                        <span class="style-arrow">↗</span>
                    </div>

                </button>


                <button class="style-card" data-style="bw"
                        aria-pressed="false">

                    <div class="style-image bw-image">
                        <img src="../images/BlackWhite"
                             alt="Black and white style portrait">

                        <span class="style-tag">03</span>
                        <span class="selected-icon">✓</span>
                    </div>

                    <div class="style-info">
                        <div>
                            <h2>Classic B&W</h2>
                            <p>Timeless, simple, elegant.</p>
                        </div>
                        <span class="style-arrow">↗</span>
                    </div>

                </button>

            </section>

            <div class="styles-bottom">

                <p id="selectionMessage">
                    Please select a style to continue.
                </p>

                <button class="continue-button" id="continueButton"
                        disabled>
                    Continue to booth <span>↗</span>
                </button>

            </div>

        </div>

    </main>

 <footer class="footer">

        <div class="footer-container">

            <a href="../index.html" class="logo">
                LifeIn<span>Four</span>
            </a>

            <p>Little moments, beautifully captured. ♡</p>

            <span class="footer-copyright">
                © <span id="currentYear"></span> LifeInFour
            </span>

        </div>

    </footer>

</body>
</html>
